[[mgr.prepend_keymap]]
on = ["g","r"]
run = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"'
desc = "Go to root(.git level in current project)"

[[mgr.prepend_keymap]]
on = "<C-/>"
for = "unix"
run = 'shell "$SHELL" --block'
desc = "Open $SHELL here"

[[mgr.prepend_keymap]]
on = ":"
run = "plugin custom-shell -- zsh --wait --block=true"
desc = "custom-shell as default, waits for user"

# C = Compress. Cn: no password (ouch). Ce: encrypted 7z (AES-256, file names encrypted too); 7zz asks for the
# password in the terminal.
[[mgr.prepend_keymap]]
on = ["C", "n"]
run = "plugin ouch"
desc = "Compress, no password (ouch)"

[[mgr.prepend_keymap]]
on = ["C", "e"]
run = 'shell --block -- "$HOME/dotfiles/scripts/yazi-encrypt.sh" %s'
desc = "Compress encrypted: 7z AES-256, names encrypted"

[[mgr.prepend_keymap]]
on = "u"
run = "plugin restore-last"
desc = "Restore last deleted files/folders (native trash)"

# [[mgr.prepend_keymap]]
# on = ["T","s"]
# run = "cd '~/.Trash/'"
# desc = "System Trash (MacOS)"

# NOTE: `dd` manda a la papelera SIN pedir confirmacion (se recupera con `u`). Como empieza con `d`
# y va antes que los atajos de fabrica, un solo `d` ahora espera la segunda tecla. `D` (borrar
# definitivo, con confirmacion) no cambia.
[[mgr.prepend_keymap]]
on = ["d","d"]
run = "remove --force" # --force es para que no pregunte "yes" or "no" 
desc = "Trash selected files without confirmation (restore with u)"

# keymap.toml
[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"

[[mgr.prepend_keymap]]
on   = [ "g", "c" ]
run  = "plugin vcs-files"
desc = "Show Git file changes"

# System clipboard: clipboard.yazi (installed with `ya pkg add XYenon/clipboard`), with the keys its README recommends.
# Yazi 26.9 has a built-in plugin called `clipboard` and shows a "deprecated plugin name" popup when a custom one uses
# that name, so the keys call it through a symlink, plugins/file-clipboard.yazi -> clipboard.yazi (the fix suggested by
# Yazi's author in sxyazi/yazi#4280). `ya pkg upgrade` keeps updating clipboard.yazi and the symlink follows.
# It works on what you selected with Space or visual mode, any number of files: y / x yank (or cut) as always and
# ALSO copy the files to the clipboard as files (paste in Finder, WhatsApp, ...); <C-p> pastes the files of the
# system clipboard here. Pasting a cut (x) file in another app copies it; only yazi's own `p` moves it.
[[mgr.prepend_keymap]]
on  = "y"
run = [ "yank", "plugin file-clipboard -- --action=copy" ]
desc = "Yank selected files (copy) and copy them to the system clipboard"

[[mgr.prepend_keymap]]
on  = "x"
run = [ "yank --cut", "plugin file-clipboard -- --action=copy" ]
desc = "Yank selected files (cut) and copy them to the system clipboard"

[[mgr.prepend_keymap]]
on  = "<C-p>"
run = "plugin file-clipboard -- --action=paste"
desc = "Paste the files of the system clipboard here"

