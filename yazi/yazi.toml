[mgr]
show_hidden    = true
ratio          = [ 0, 4, 4 ] # a + b + c = 8
# linemode       = "permissions"
image_quality  = 50

#NOTE: Esto hará que las imagenes sean mas grande, pero scrolleando entre archivos hara que se sienta
#un ligero retraso. Esto pasa en todas las terminales. Pero por alguna razon KittyTerm va fenomenal.
#No es siente para nada ese retraso.(Cosa que si sentia bastante en Ghostty). 
#NOTE: Update: Now I use KittyTerm
[preview]
max_width       = 1500
max_height      = 1800

[open]
prepend_rules = [
  # NOTE: Reglas por mime (no por extension): los archivos dentro de la papelera tienen mime
  # "trash/*", asi que NO se ven afectados y siguen mostrando "Restore selected files" /
  # "Empty trash bin" con Shift+O. Con `url = "*.png"` la regla tambien atrapaba la papelera.
  { mime = "image/png",     use = [ "imagen", "edit_image", "reveal" ] },
  { mime = "image/svg+xml", use = [ "open", "reveal" ] },  # svg y gif: comportamiento default
  { mime = "image/gif",     use = [ "open", "reveal" ] },
  { mime = "image/*",       use = [ "imagen", "reveal" ] },

  # { mime = "application/pdf", use = "docs" },

  # NOTE: `o` siempre ejecuta el PRIMER opener de la lista (play = IINA) y Shift+O muestra el menu.
  # "voicememo" va segundo para no cambiar lo que hace `o`.
  { mime = "audio/*", use = [ "play", "voicememo", "reveal" ] },

  # NOTE: 7zz (el extractor nativo de Yazi) no puede con los RAR de WinRAR 7 ni los cifrados, y no pide la
  # contrasena. Los .rar usan el plugin rar-extract (ouch + cuadro de contrasena); `extract` queda 2da.
  { mime = "application/{rar,x-rar,vnd.rar}", use = [ "rar", "extract", "reveal" ] },
]

[opener]
video_all = [
    { run = 'open -a "Preview" %s', block = true, for = "unix" },
]

docs = [
    { run = 'open -a "Firefox" %s', block = true, for = "unix" },
]
imagen = [
    { run = 'open -a "Phoenix Slides" %s', desc = "Abrir con Phoenix Slides", block = true, for = "macos" },
]
edit = [
    { run = 'nvim %s', block = true, for = "unix" },
]
edit_image = [
    { run = 'open -a "macshot" %s', desc = "Editar con macshot", block = true, for = "unix" },
]
play = [
    { run = 'open -a "IINA" %s', block = true, for = "macos" },
    # { run = 'open -a "QuickTime Player" %s', block = true, for = "macos" },
]
rar = [
    # Publica el evento que atiende plugins/rar-extract.yazi (igual que el opener `extract` de fabrica).
    { run = 'ya pub rar-extract --list %s', desc = "Extract RAR (ouch)", for = "unix" },
]
voicememo = [
    # Convierte a m4a (Voice Memos no acepta .opus) y lo importa. Sin `block`: corre como tarea de fondo.
    { run = '"$HOME/dotfiles/scripts/wa2memo.sh" %s', desc = "Enviar a Voice Memos", for = "macos" },
]

  [[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"
[plugin]

  prepend_previewers = [
    
    # EPUB is a zip: this rule must come BEFORE the ouch ones below or the file list would win (first match wins).
    { url = "*.epub", run = 'piper -- pandoc -t plain --columns=$w "$1"' },

    # Tree previewer for compress archives https://github.com/ndtoan96/ouch.yazi
    { mime = "application/*zip",            run = "ouch" },
    { mime = "application/x-tar",           run = "ouch" },
    { mime = "application/x-bzip2",         run = "ouch" },
    { mime = "application/x-7z-compressed", run = "ouch" },
    { mime = "application/x-rar",           run = "ouch" },
    { mime = "application/vnd.rar",         run = "ouch" },
    { mime = "application/x-xz",            run = "ouch" },
    { mime = "application/xz",              run = "ouch" },
    { mime = "application/x-zstd",          run = "ouch" },
    { mime = "application/zstd",            run = "ouch" },
    { mime = "application/java-archive",    run = "ouch" },

    # piper (https://github.com/yazi-rs/plugins/tree/main/piper.yazi): the output of a shell command is the preview.
    # "$1" is the hovered file, $w / $h the size of the preview pane. A piper command can use pipes; stderr shows
    # as an error in the pane, so commands that may fail redirect it (2>/dev/null) and fall back to another one.
    # Folders: tree of two levels with icons (yazi's own folder preview only lists the first level).
    { url = "*/", run = 'piper -- eza --tree --level=2 --icons=always --color=always --group-directories-first "$1"' },
    # JSON: pretty-printed and colored (minified JSON is one unreadable line otherwise); invalid JSON/JSONC falls back to bat.
    { url = "*.json", run = 'piper -- jq -C . "$1" 2>/dev/null || bat -p --color=always "$1"' },
    # CSV / TSV: aligned columns. Only the first 500 lines (`column` needs the whole input before printing, which
    # would freeze yazi on a huge file); the sed makes empty fields keep their column (BSD `column` collapses them).
    { url = "*.csv", run = 'piper -- head -n 500 "$1" | sed "s/,,/, ,/g;s/,,/, ,/g" | column -t -s ","' },
    { url = "*.tsv", run = 'piper -- head -n 500 "$1" | column -t -s "$(printf "\t")"' },
    # Markdown rendered with glow (headings, lists, tables, code blocks). The style follows the terminal theme ($t).
    { url = "*.{md,markdown}", run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s="$([ "$t" = light ] && echo light || echo dark)" "$1"' },
    # Documents: pandoc turns them into plain text at the width of the pane (HTML is handled by w3m below).
    { url = "*.{docx,odt,rst,tex,org}", run = 'piper -- pandoc -t plain --columns=$w "$1"' },
    # HTML: w3m renders the page as text (lists, tables, link list) at the width of the pane.
    { url = "*.{html,htm}", run = 'piper -- w3m -dump -cols $w "$1"' },
    # Logs: a Salesforce debug log shows only its USER_DEBUG / EXCEPTION / FATAL lines, any other log shows its END.
    # The decision lives in a script because it needs an if/else (see scripts/yazi-log-preview.sh).
    { url = "*.log", run = 'piper -- "$HOME/dotfiles/scripts/yazi-log-preview.sh" "$1" "$h"' },
    # Audio: tags and technical data with ffprobe (ffmpeg is in the Brewfile; images and video keep yazi's own thumbnail).
    { mime = "audio/*", run = 'piper -- ffprobe -hide_banner "$1" 2>&1' },
    # SQLite: the schema.
    { url = "*.{db,sqlite,sqlite3}", run = 'piper -- sqlite3 -readonly "$1" .schema 2>&1 | bat -p -l sql --color=always' },
  ]

# For a large file like Adobe Illustrator, Adobe Photoshop, etc
# you may need to increase the memory limit if no image is rendered.
# https://yazi-rs.github.io/docs/configuration/yazi#tasks
[tasks]
  image_alloc      = 1073741824        # = 1024*1024*1024 = 1024MB
